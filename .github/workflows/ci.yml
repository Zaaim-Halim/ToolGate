name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every module's tests, Cases A to G on both frameworks included, and every fuzz target on its saved inputs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14

  # The console in a real browser: tests tagged "e2e", which the default build skips.
  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Same version as playwright.version in toolgate-approvals-web, so the Java driver finds this browser.
      - run: npx -y playwright@1.55.0 install --with-deps chromium
      - run: ./mvnw -B -ntp -pl toolgate-approvals-web -am -Pe2e verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-reports
          path: toolgate-approvals-web/target/surefire-reports/
          retention-days: 14

  # What Maven Central will get, minus the signatures: sources, Javadoc and SBOMs build cleanly.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp -Prelease -Dgpg.skip -DskipTests verify
